services:
  app:
    build: .
    image: devops-task-manager:2.0
    ports:
      - "5002:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: