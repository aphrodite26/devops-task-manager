
name: DevOps Task Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  POSTGRES_USER: taskuser
  POSTGRES_PASSWORD: testpassword
  POSTGRES_DB: taskmanager
  DATABASE_URL: postgresql://taskuser:testpassword@db:5432/taskmanager

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/test_app.py -v

      - name: Build Docker image
        run: docker build -t devops-task-manager:ci .

      - name: Start application with Docker Compose
        run: docker compose up -d --build --wait

      - name: Wait for Flask API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5002/health; then
              echo "Flask API is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Flask API failed to start"
          docker compose logs
          exit 1

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -v

      - name: Stop Docker containers
        if: always()
        run: docker compose down

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Tag and push Docker image
        if: github.event_name == 'push' && success()
        run: |
          IMAGE=ghcr.io/aphrodite26/devops-task-manager
          VERSION=${GITHUB_SHA::7}

          docker tag devops-task-manager:ci $IMAGE:latest
          docker tag devops-task-manager:ci $IMAGE:$VERSION

          docker push $IMAGE:latest
          docker push $IMAGE:$VERSION
